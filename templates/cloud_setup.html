<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ET EXPO · 新版账号初始化</title>
<style>body{font:16px system-ui;background:#eef2f7;color:#14213d;margin:0}main{max-width:620px;margin:50px auto;padding:32px;background:white;border-radius:16px}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbc6d4;border-radius:6px}button{margin-top:20px;padding:12px 24px;background:#164b97;color:white;border:0;border-radius:6px}code{overflow-wrap:anywhere}#status{white-space:pre-wrap}</style>
<main><h1>ET EXPO 营销系统</h1><p>新版已启动 · 等待正式账号初始化</p><p>真实发布与邮件发送关闭。现有数据保留，初始化前营销后台暂不开放。</p><form id="begin"><label for="key">管理员设置密钥</label><input id="key" type="password" autocomplete="off" required><p>密钥保存在 Render 持久磁盘的 .owner-setup-key 文件中，仅通过 Render 管理终端获取。不要发到聊天里。</p><button>开始设置</button></form>
<form id="finish" hidden><p>登录邮箱：leo@etexpous.com</p><p>在手机验证器添加“基于时间”的账号，名称 ET EXPO Marketing，6 位、30 秒：</p><code id="totp"></code><label for="password">新密码（至少 16 字符）</label><input id="password" type="password" minlength="16" autocomplete="new-password" required><label for="repeat">再次输入密码</label><input id="repeat" type="password" minlength="16" autocomplete="new-password" required><label for="code">验证器当前 6 位验证码</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><button>完成正式账号设置</button></form><p id="status" role="status"></p></main><script src="/setup.js"></script></html>
