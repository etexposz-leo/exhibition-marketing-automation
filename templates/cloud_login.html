<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ET EXPO · 云端登录</title>
<style>body{font:16px/1.6 system-ui;background:#102437;color:#ecf4ff;display:grid;place-items:center;min-height:95vh}main{width:min(380px,85vw);padding:30px;border:1px solid #54738b;border-radius:16px}label,input,button{display:block;box-sizing:border-box;width:100%}input,button{padding:12px;margin:8px 0 20px;border-radius:8px;border:1px solid #7894a8;font:inherit}button{background:#b2ddff;color:#102437;cursor:pointer}p{color:#bacddd}#error{color:#ffb5b5}</style></head><body><main><h1>ET EXPO Marketing</h1><p>正式账号 · 密码与验证器登录</p><form id="login"><label>登录邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><label>验证器中的 6 位验证码<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>登录</button></form><p id="error" role="status"></p><p>真实发布关闭。请勿在聊天中发送密码或验证码。</p></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value,code:document.getElementById('code').value})});if(response.ok){location.assign('/marketing');return;}document.getElementById('error').textContent=response.status===429?'尝试次数过多，请 15 分钟后重试。':'登录失败，请检查邮箱、密码和当前验证码。';}catch{document.getElementById('error').textContent='暂时无法连接，请稍后再试。';}finally{document.getElementById('password').value='';document.getElementById('code').value='';button.disabled=false;}};
</script></body></html>
